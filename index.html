<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字排序助手</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            padding: 20px;
            background: #f2f2f7;
        }

        .container {
            max-width: 600px;
            margin: auto;
        }

        h1 {
            text-align: center;
            font-size: 24px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-size: 16px;
        }

        textarea {
            width: 100%;
            height: 45px;
            font-size: 18px;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #aaa;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            font-size: 18px;
            color: white;
            background: #007aff;
            border: none;
            border-radius: 8px;
        }

        .clear-button {
            background: #8e8e93;
        }

        .table-wrap {
            margin-top: 25px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            border-collapse: collapse;
            table-layout: fixed;
        }

        td {
            border: 1px solid black;
            text-align: center;
            font-size: 22px;
            height: 50px;
            min-width: 50px;
        }

        /* ↓ 仅新增历史记录卡片样式，完全不改动原有表格样式 */
        .history-section {
            margin-top: 35px;
            border-top: 1px solid #ccc;
            padding-top: 20px;
        }

        .history-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .history-item {
            background: #fff;
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 15px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.1);
        }

        .history-time {
            font-size: 13px;
            color: #666;
            margin-bottom: 6px;
        }

        .delete-all-history-button {
            background: #ff3b30;
            margin-top: 12px;
        }

        .no-history {
            color: #999;
            font-size: 15px;
            text-align: center;
            padding: 15px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>数字排序助手</h1>

    <label>第一组数据：</label>
    <textarea id="input1" placeholder="例如：5 3 8 3 1"></textarea>

    <label>第二组数据：</label>
    <textarea id="input2" placeholder="例如：9 2 6 2 7"></textarea>

    <button class="clear-button" onclick="clearSecond()">清除第二组数据</button>
    <button onclick="runSort()">排序</button>

    <div class="table-wrap">
        <div id="result"></div>
    </div>

    <!-- 历史记录区域（新增） -->
    <div class="history-section">
        <div class="history-title">📋 最近10条结果</div>
        <div id="historyList"></div>
        <button id="deleteAllHistory" class="delete-all-history-button">🗑️ 删除全部历史记录</button>
    </div>
</div>

<script>
    // 支持 空格 , ， . 。 、 ; 等分隔
    function getNumbers(text) {
        text = text.replace(/[，。；、,.;|]+/g, " ");
        return text
            .trim()
            .split(/\s+/)
            .filter(x => x !== "")
            .map(Number)
            .filter(x => !Number.isNaN(x));
    }

    // 排序规则：重复数字保留一个排序，另一个放最后
    function specialSort(arr) {
        let count = {};
        arr.forEach(n => {
            count[n] = (count[n] || 0) + 1;
        });

        let normal = [];
        let duplicate = [];

        arr.forEach(n => {
            if (count[n] > 1) {
                if (!normal.includes(n)) {
                    normal.push(n);
                } else {
                    duplicate.push(n);
                }
            } else {
                normal.push(n);
            }
        });

        normal.sort((a, b) => a - b);
        return normal.concat(duplicate);
    }

    function runSort() {
        let first = specialSort(
            getNumbers(document.getElementById("input1").value)
        );
        let second = specialSort(
            getNumbers(document.getElementById("input2").value)
        );

        if (first.length === 0 && second.length === 0) {
            document.getElementById("result").innerHTML = "";
            return;
        }

        // 补齐第二行
        const paddedSecond = [...second];
        while (paddedSecond.length < first.length) {
            paddedSecond.push("");
        }

        let html = "<table>";
        html += "<tr>";
        first.forEach(n => {
            html += "<td>" + n + "</td>";
        });
        html += "</tr>";
        html += "<tr>";
        paddedSecond.forEach(n => {
            html += "<td>" + n + "</td>";
        });
        html += "</tr>";
        html += "</table>";

        document.getElementById("result").innerHTML = html;

        // 保存排序结果到历史（仅保存结果数组）
        saveHistoryResult(first, second.filter(n => n !== ""));
    }

    // 只清除第二组输入框
    function clearSecond() {
        document.getElementById("input2").value = "";
    }

    // ========== 历史记录相关函数 ==========

    // 保存历史（只保存排序后的结果）
    function saveHistoryResult(sorted1, sorted2) {
        if (sorted1.length === 0 && sorted2.length === 0) return;

        let history = JSON.parse(localStorage.getItem('sortHistory')) || [];
        history.unshift({
            timestamp: new Date().toLocaleString(),
            sorted1: sorted1,
            sorted2: sorted2
        });

        if (history.length > 10) {
            history = history.slice(0, 10);
        }
        localStorage.setItem('sortHistory', JSON.stringify(history));
        renderHistory();
    }

    // 渲染历史记录（使用与主结果完全相同的表格结构）
    function renderHistory() {
        const container = document.getElementById('historyList');
        const history = JSON.parse(localStorage.getItem('sortHistory')) || [];

        if (history.length === 0) {
            container.innerHTML = '<div class="no-history">暂无历史结果</div>';
            return;
        }

        let html = '';
        history.forEach(item => {
            const firstRow = item.sorted1;
            const secondRow = [...item.sorted2];
            while (secondRow.length < firstRow.length) {
                secondRow.push("");
            }

            // 构建与主结果完全相同的表格（相同的HTML结构，依赖相同的CSS）
            let tableHtml = '<table><tr>';
            firstRow.forEach(n => {
                tableHtml += '<td>' + n + '</td>';
            });
            tableHtml += '</tr><tr>';
            secondRow.forEach(n => {
                tableHtml += '<td>' + (n !== "" ? n : '') + '</td>';
            });
            tableHtml += '</tr></table>';

            html += '<div class="history-item">' +
                        '<div class="history-time">' + item.timestamp + '</div>' +
                        '<div class="table-wrap">' + tableHtml + '</div>' +
                    '</div>';
        });
        container.innerHTML = html;
    }

    // 删除全部历史
    function deleteAllHistory() {
        if (confirm('确定要删除全部历史结果吗？')) {
            localStorage.removeItem('sortHistory');
            renderHistory();
        }
    }

    // 自动保存输入内容
    document.getElementById("input1").addEventListener("input", function () {
        localStorage.setItem("firstData", this.value);
    });
    document.getElementById("input2").addEventListener("input", function () {
        localStorage.setItem("secondData", this.value);
    });

    // 页面初始化
    window.onload = function () {
        document.getElementById("input1").value =
            localStorage.getItem("firstData") || "";
        document.getElementById("input2").value =
            localStorage.getItem("secondData") || "";

        // 绑定删除按钮
        document.getElementById('deleteAllHistory').addEventListener('click', deleteAllHistory);

        // 渲染历史记录
        renderHistory();

        // 如果有数据，自动排序
        if (document.getElementById("input1").value.trim() !== '' ||
            document.getElementById("input2").value.trim() !== '') {
            runSort();
        }
    };
</script>

</body>
</html>
