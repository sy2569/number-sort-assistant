<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字排序助手</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            padding: 20px; background: #f2f2f7;
        }
        .container { max-width: 600px; margin: auto; }
        h1 { text-align: center; font-size: 24px; margin-bottom: 8px; }
        label { display: block; margin-top: 15px; font-size: 16px; }
        textarea {
            width: 100%; height: 45px; font-size: 18px; padding: 10px;
            border-radius: 8px; border: 1px solid #aaa; resize: vertical;
            font-family: inherit;
        }
        button {
            width: 100%; padding: 12px; margin-top: 15px; font-size: 18px;
            color: white; background: #007aff; border: none; border-radius: 8px;
            cursor: pointer; transition: background 0.2s;
        }
        button:active { opacity: 0.8; }
        .clear-button { background: #8e8e93; }
        .delete-all-history-button { background: #ff3b30; margin-top: 10px; }

        /* 表格容器：固定格子大小 + 横向滚动 */
        .table-wrap {
            margin-top: 10px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: 10px;
            background: #fff;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        table {
            border-collapse: collapse;
            table-layout: fixed;   /* 固定列宽，配合min-width使用 */
            width: 100%;           /* 让表格占满容器，但列宽按比例分配 */
            min-width: max-content; /* 如果数字很多，表格至少要有内容宽度，触发滚动 */
        }
        td {
            border: 1px solid black;
            text-align: center;
            font-size: 22px;
            height: 50px;
            min-width: 50px;      /* 每个格子最小50px */
            padding: 6px;
        }

        /* 历史记录区域 */
        .history-section {
            margin-top: 30px;
            border-top: 1px solid #ccc;
            padding-top: 20px;
        }
        .history-title { font-size: 20px; font-weight: bold; margin-bottom: 15px; }

        /* 每条历史记录卡片：纯块级布局，不压缩内部表格 */
        .history-item {
            display: block;
            background: #fff;
            border-radius: 12px;
            padding: 12px 15px;
            margin-bottom: 15px;
            box-shadow: 0 1px 6px rgba(0,0,0,0.1);
            overflow: hidden;      /* 配合内部滚动 */
        }
        .history-time {
            color: #666;
            font-size: 13px;
            margin-bottom: 8px;
            font-weight: 500;
        }
        /* 历史记录内的表格容器单独处理，去掉重复的阴影和圆角 */
        .history-item .table-wrap {
            margin-top: 0;
            box-shadow: none;
            border-radius: 8px;
        }
        .no-history {
            color: #999;
            font-size: 15px;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>数字排序助手</h1>

    <label>第一组数据：</label>
    <textarea id="input1" placeholder="例如：5 3 8 3 1"></textarea>

    <label>第二组数据：</label>
    <textarea id="input2" placeholder="例如：9 2 6 2 7"></textarea>

    <button class="clear-button" onclick="clearSecond()">清除第二组数据</button>
    <button onclick="runSort()">排序</button>

    <div class="table-wrap">
        <div id="result"></div>
    </div>

    <!-- 历史记录区域 -->
    <div class="history-section">
        <div class="history-title">📋 最近10条结果</div>
        <div id="historyList"></div>
        <button id="deleteAllHistory" class="delete-all-history-button">🗑️ 删除全部历史记录</button>
    </div>
</div>

<script>
    function getNumbers(text) {
        text = text.replace(/[，。；、,.;|]+/g, " ");
        return text.trim().split(/\s+/).filter(x => x !== "").map(Number).filter(x => !Number.isNaN(x));
    }

    function specialSort(arr) {
        let count = {};
        arr.forEach(n => { count[n] = (count[n] || 0) + 1; });
        let normal = [], duplicate = [];
        arr.forEach(n => {
            if (count[n] > 1) {
                if (!normal.includes(n)) normal.push(n);
                else duplicate.push(n);
            } else {
                normal.push(n);
            }
        });
        normal.sort((a, b) => a - b);
        return normal.concat(duplicate);
    }

    function saveHistoryResult(sorted1, sorted2) {
        const cleanSorted2 = sorted2.filter(n => n !== "");
        if (sorted1.length === 0 && cleanSorted2.length === 0) return;

        let history = JSON.parse(localStorage.getItem('sortHistory')) || [];
        history.unshift({
            timestamp: new Date().toLocaleString(),
            sorted1: sorted1,
            sorted2: cleanSorted2
        });
        if (history.length > 10) history = history.slice(0, 10);
        localStorage.setItem('sortHistory', JSON.stringify(history));
        renderHistory();
    }

    // ✅ 修正后的历史记录渲染：表格格子大小固定，可滑动
    function renderHistory() {
        const container = document.getElementById('historyList');
        const history = JSON.parse(localStorage.getItem('sortHistory')) || [];

        if (history.length === 0) {
            container.innerHTML = '<div class="no-history">暂无历史结果</div>';
            return;
        }

        let html = '';
        history.forEach(item => {
            const firstRow = item.sorted1;
            const secondRow = [...item.sorted2];
            while (secondRow.length < firstRow.length) {
                secondRow.push("");
            }

            // 构建与主结果完全相同的表格结构
            let tableHtml = '<table><tr>';
            firstRow.forEach(n => {
                tableHtml += '<td>' + n + '</td>';
            });
            tableHtml += '</tr><tr>';
            secondRow.forEach(n => {
                tableHtml += '<td>' + (n !== "" ? n : '') + '</td>';
            });
            tableHtml += '</tr></table>';

            html += `
                <div class="history-item">
                    <div class="history-time">${item.timestamp}</div>
                    <div class="table-wrap">
                        ${tableHtml}
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    function deleteAllHistory() {
        if (confirm('确定要删除全部历史结果吗？')) {
            localStorage.removeItem('sortHistory');
            renderHistory();
        }
    }

    function runSort() {
        const input1Text = document.getElementById('input1').value;
        const input2Text = document.getElementById('input2').value;
        let first = specialSort(getNumbers(input1Text));
        let second = specialSort(getNumbers(input2Text));

        if (first.length === 0 && second.length === 0) {
            document.getElementById('result').innerHTML = '';
            return;
        }

        const paddedSecond = [...second];
        while (paddedSecond.length < first.length) paddedSecond.push("");

        let html = "<table><tr>";
        first.forEach(n => { html += "<td>" + n + "</td>"; });
        html += "</tr><tr>";
        paddedSecond.forEach(n => { html += "<td>" + n + "</td>"; });
        html += "</tr></table>";

        document.getElementById('result').innerHTML = html;
        saveHistoryResult(first, second);
    }

    function clearSecond() {
        document.getElementById('input2').value = "";
    }

    // 初始化
    (function init() {
        document.getElementById('input1').value = localStorage.getItem('firstData') || "";
        document.getElementById('input2').value = localStorage.getItem('secondData') || "";

        renderHistory();

        document.getElementById('deleteAllHistory').addEventListener('click', deleteAllHistory);

        document.getElementById('input1').addEventListener('input', function() {
            localStorage.setItem('firstData', this.value);
        });
        document.getElementById('input2').addEventListener('input', function() {
            localStorage.setItem('secondData', this.value);
        });

        if (document.getElementById('input1').value.trim() !== '' || document.getElementById('input2').value.trim() !== '') {
            runSort();
        }
    })();
</script>
</body>
</html>
