<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>数字排序助手</title>


<style>

* {
    box-sizing: border-box;
}


body {

    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

    padding:20px;

    background:#f2f2f7;

}


.container {

    max-width:600px;

    margin:auto;

}


h1 {

    text-align:center;

    font-size:24px;

}



label {

    display:block;

    margin-top:15px;

    font-size:16px;

}



textarea {

    width:100%;

    height:45px;

    font-size:18px;

    padding:10px;

    border-radius:8px;

    border:1px solid #aaa;

}



button {

    width:100%;

    padding:12px;

    margin-top:15px;

    font-size:18px;

    color:white;

    background:#007aff;

    border:none;

    border-radius:8px;

}



.clear-button {

    background:#8e8e93;

}



.table-wrap {

    margin-top:25px;

    overflow-x:auto;

    -webkit-overflow-scrolling:touch;

}



table {

    border-collapse:collapse;

    table-layout:fixed;

}



td {

    border:1px solid black;

    text-align:center;

    font-size:22px;

    height:50px;

    min-width:50px;

}



</style>


</head>


<body>


<div class="container">


<h1>数字排序助手</h1>



<label>
第一组数据：
</label>


<textarea id="input1"
placeholder="例如：5 3 8 3 1"></textarea>




<label>
第二组数据：
</label>


<textarea id="input2"
placeholder="例如：9 2 6 2 7"></textarea>



<button class="clear-button" onclick="clearSecond()">

清除第二组数据

</button>



<button onclick="runSort()">

排序

</button>




<div class="table-wrap">

<div id="result"></div>

</div>



</div>





<script>


// 支持 空格 , ， . 。 、 ; 等分隔

function getNumbers(text){


    text = text.replace(/[，。；、,.;|]+/g," ");


    return text

    .trim()

    .split(/\s+/)

    .filter(x=>x!=="")

    .map(Number)

    .filter(x=>!Number.isNaN(x));


}





// 排序规则
// 重复数字保留一个排序，另一个放最后

function specialSort(arr){


    let count={};


    arr.forEach(n=>{

        count[n]=(count[n]||0)+1;

    });



    let normal=[];

    let duplicate=[];



    arr.forEach(n=>{


        if(count[n]>1){


            if(!normal.includes(n)){

                normal.push(n);

            }

            else{

                duplicate.push(n);

            }


        }

        else{


            normal.push(n);

        }


    });



    normal.sort((a,b)=>a-b);



    return normal.concat(duplicate);


}





function runSort(){



    let first = specialSort(

        getNumbers(
            document.getElementById("input1").value
        )

    );



    let second = specialSort(

        getNumbers(
            document.getElementById("input2").value
        )

    );



    if(first.length===0){

        return;

    }



    while(second.length < first.length){

        second.push("");

    }




    let html="<table>";



    html+="<tr>";

    first.forEach(n=>{

        html += "<td>"+n+"</td>";

    });

    html+="</tr>";




    html+="<tr>";

    second.forEach(n=>{

        html += "<td>"+n+"</td>";

    });

    html+="</tr>";



    html+="</table>";



    document.getElementById("result").innerHTML=html;


}





// 只清除第二组输入框

function clearSecond(){


    document.getElementById("input2").value="";


}



</script>



</body>

</html>
