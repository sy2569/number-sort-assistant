<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#007aff">

<title>数字排序助手</title>


<style>

body{

    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

    background:#f2f2f7;

    padding:20px;

}


.container{

    max-width:500px;

    margin:auto;

}


h1{

    text-align:center;

}


textarea{

    width:100%;

    height:45px;

    font-size:18px;

    padding:10px;

    margin-bottom:10px;

    border-radius:8px;

    border:1px solid #aaa;

}



button{

    width:100%;

    height:45px;

    margin-top:10px;

    font-size:18px;

    border:none;

    border-radius:8px;

    background:#007aff;

    color:white;

}


.clear{

    background:#8e8e93;

}



table{

    border-collapse:collapse;

    margin-top:25px;

    width:100%;

}



td{

    border:1px solid black;

    height:55px;

    text-align:center;

    font-size:22px;

}



</style>


</head>



<body>


<div class="container">


<h1>数字排序助手</h1>



<label>第一组数据：</label>

<textarea id="input1"
placeholder="例如：5 3 8 3 1"></textarea>



<label>第二组数据：</label>

<textarea id="input2"
placeholder="例如：9.2.6.2.7"></textarea>



<button class="clear" onclick="clearSecond()">

清除第二组数据

</button>



<button onclick="runSort()">

排序

</button>



<div id="result"></div>


</div>




<script>



function getNumbers(text){


    // 把各种分隔符统一处理

    text=text.replace(/[，。；、,.;|]/g," ");



    let arr=text

    .trim()

    .split(/\s+/)

    .filter(x=>x!="")

    .map(Number);



    return arr.filter(x=>!isNaN(x));


}




function specialSort(arr){


    let count={};


    arr.forEach(n=>{

        count[n]=(count[n]||0)+1;

    });



    let normal=[];

    let duplicate=[];


    arr.forEach(n=>{


        if(count[n]>1){


            if(!normal.includes(n)){

                normal.push(n);

            }

            else{

                duplicate.push(n);

            }


        }

        else{


            normal.push(n);


        }


    });



    normal.sort((a,b)=>a-b);



    return normal.concat(duplicate);


}




function runSort(){



    let first=specialSort(

        getNumbers(

            document.getElementById("input1").value

        )

    );



    let second=specialSort(

        getNumbers(

            document.getElementById("input2").value

        )

    );



    if(first.length==0){

        return;

    }



    while(second.length < first.length){

        second.push("");

    }



    let html="<table>";



    html+="<tr>";

    first.forEach(n=>{

        html+="<td>"+n+"</td>";

    });

    html+="</tr>";



    html+="<tr>";

    second.forEach(n=>{

        html+="<td>"+n+"</td>";

    });

    html+="</tr>";



    html+="</table>";



    document.getElementById("result").innerHTML=html;



}




function clearSecond(){


    // 只清除输入框

    document.getElementById("input2").value="";


}



</script>


</body>

</html>
