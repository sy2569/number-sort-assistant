<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字排序助手</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            padding: 20px;
            background: #f2f2f7;
        }

        .container {
            max-width: 600px;
            margin: auto;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 6px;
        }

        .mode-switch {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .mode-btn {
            padding: 8px 20px;
            font-size: 15px;
            border: 1px solid #007aff;
            background: white;
            color: #007aff;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            width: auto;
            margin: 0;
        }

        .mode-btn.active {
            background: #007aff;
            color: white;
        }

        label {
            display: block;
            margin-top: 15px;
            font-size: 16px;
        }

        textarea {
            width: 100%;
            height: 45px;
            font-size: 18px;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #aaa;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            font-size: 18px;
            color: white;
            background: #007aff;
            border: none;
            border-radius: 8px;
        }

        .clear-button {
            background: #8e8e93;
        }

        .table-wrap {
            margin-top: 25px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            border-collapse: collapse;
            table-layout: fixed;
        }

        td {
            border: 1px solid black;
            text-align: center;
            font-size: 22px;
            height: 50px;
            min-width: 50px;
        }

        /* 差异标记（上下不同时同时标红，低可见度） */
        .diff-highlight {
            background-color: rgba(255, 0, 0, 0.15);
        }

        .history-section {
            margin-top: 35px;
            border-top: 1px solid #ccc;
            padding-top: 20px;
        }

        .history-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .history-item {
            background: #fff;
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 15px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.1);
        }

        .history-time {
            font-size: 13px;
            color: #666;
            margin-bottom: 6px;
        }

        .delete-all-history-button {
            background: #ff3b30;
            margin-top: 12px;
        }

        .no-history {
            color: #999;
            font-size: 15px;
            text-align: center;
            padding: 15px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>数字排序助手</h1>

    <!-- 排序模式切换按钮 -->
    <div class="mode-switch">
        <button id="modeA" class="mode-btn active">顺序排序</button>
        <button id="modeB" class="mode-btn">对齐排序</button>
    </div>

    <label>第一组数据：</label>
    <textarea id="input1" placeholder="例如：5 3 8 3 1"></textarea>

    <label>第二组数据：</label>
    <textarea id="input2" placeholder="例如：9 2 6 2 7"></textarea>

    <button class="clear-button" onclick="clearSecond()">清除第二组数据</button>
    <button onclick="runSort()">排序</button>

    <div class="table-wrap">
        <div id="result"></div>
    </div>

    <!-- 历史记录区域 -->
    <div class="history-section">
        <div class="history-title">📋 最近10条结果</div>
        <div id="historyList"></div>
        <button id="deleteAllHistory" class="delete-all-history-button">🗑️ 删除全部历史记录</button>
    </div>
</div>

<script>
    // 当前排序模式，从存储中恢复，默认为 'A'
    let currentMode = localStorage.getItem('sortMode') || 'A';

    function saveMode() {
        localStorage.setItem('sortMode', currentMode);
    }

    function updateModeButtons() {
        document.getElementById('modeA').classList.toggle('active', currentMode === 'A');
        document.getElementById('modeB').classList.toggle('active', currentMode === 'B');
    }

    // 提取数字
    function getNumbers(text) {
        text = text.replace(/[，。；、,.;|]+/g, " ");
        return text.trim().split(/\s+/).filter(x => x !== "").map(Number).filter(x => !Number.isNaN(x));
    }

    // 模式A：重复数字保留一个排序，其余重复项放在最后
    function sortModeA(arr) {
        let count = {};
        arr.forEach(n => {
            count[n] = (count[n] || 0) + 1;
        });

        let normal = [];
        let duplicate = [];

        arr.forEach(n => {
            if (count[n] > 1) {
                if (!normal.includes(n)) {
                    normal.push(n);
                } else {
                    duplicate.push(n);
                }
            } else {
                normal.push(n);
            }
        });

        normal.sort((a, b) => a - b);
        return normal.concat(duplicate);
    }

    // 模式B：新对齐逻辑
    function sortModeB(firstArr, secondArr) {
        // 第一行：升序排序
        const sortedFirst = [...firstArr].sort((a, b) => a - b);

        // 统计第二组数字的个数
        const secondCount = new Map();
        secondArr.forEach(n => {
            secondCount.set(n, (secondCount.get(n) || 0) + 1);
        });

        // 构建第二行，先尝试匹配第一行的每个数字
        const secondLine = [];
        sortedFirst.forEach(val => {
            if (secondCount.has(val) && secondCount.get(val) > 0) {
                secondLine.push(val);
                secondCount.set(val, secondCount.get(val) - 1);
            } else {
                secondLine.push(null); // 留空
            }
        });

        // 收集剩余数字（多余的数字），并按升序排列
        let surplus = [];
        for (let [num, cnt] of secondCount) {
            for (let i = 0; i < cnt; i++) {
                surplus.push(num);
            }
        }
        surplus.sort((a, b) => a - b);

        // 将多余数字依次填入空位
        for (let i = 0; i < secondLine.length; i++) {
            if (secondLine[i] === null && surplus.length > 0) {
                secondLine[i] = surplus.shift();
            }
        }

        // 如果还有剩余数字，追加在末尾
        while (surplus.length > 0) {
            secondLine.push(surplus.shift());
        }

        return { first: sortedFirst, second: secondLine };
    }

    // 运行排序
    function runSort() {
        const firstRaw = getNumbers(document.getElementById("input1").value);
        const secondRaw = getNumbers(document.getElementById("input2").value);

        if (firstRaw.length === 0 && secondRaw.length === 0) {
            document.getElementById("result").innerHTML = "";
            return;
        }

        let first, second;

        if (currentMode === 'B') {
            const result = sortModeB(firstRaw, secondRaw);
            first = result.first;
            second = result.second;
        } else {
            first = sortModeA(firstRaw);
            second = sortModeA(secondRaw);
        }

        // 确保两行至少有一行有数据，并计算最长长度用于补齐显示
        const maxLen = Math.max(first.length, second.length);
        const paddedFirst = [...first];
        const paddedSecond = [...second];
        while (paddedFirst.length < maxLen) paddedFirst.push("");
        while (paddedSecond.length < maxLen) paddedSecond.push("");

        // 生成表格，同时根据差异标记红色（仅模式B）
        let html = "<table><tr>";
        for (let i = 0; i < maxLen; i++) {
            let cellClass = "";
            if (currentMode === 'B') {
                const v1 = paddedFirst[i] === "" ? "" : paddedFirst[i];
                const v2 = paddedSecond[i] === "" ? "" : paddedSecond[i];
                if (v1 !== v2) {
                    cellClass = ' class="diff-highlight"';
                }
            }
            html += "<td" + cellClass + ">" + (paddedFirst[i] !== "" ? paddedFirst[i] : "") + "</td>";
        }
        html += "</tr><tr>";
        for (let i = 0; i < maxLen; i++) {
            let cellClass = "";
            if (currentMode === 'B') {
                const v1 = paddedFirst[i] === "" ? "" : paddedFirst[i];
                const v2 = paddedSecond[i] === "" ? "" : paddedSecond[i];
                if (v1 !== v2) {
                    cellClass = ' class="diff-highlight"';
                }
            }
            html += "<td" + cellClass + ">" + (paddedSecond[i] !== "" ? paddedSecond[i] : "") + "</td>";
        }
        html += "</tr></table>";

        document.getElementById("result").innerHTML = html;

        // 保存历史记录（只保存非空结果）
        const cleanFirst = first.length === 0 ? [] : first;
        const cleanSecond = second.filter(n => n !== null && n !== "");
        saveHistoryResult(cleanFirst, cleanSecond);
    }

    function clearSecond() {
        document.getElementById("input2").value = "";
    }

    // ========== 历史记录 ==========
    function saveHistoryResult(sorted1, sorted2) {
        if (sorted1.length === 0 && sorted2.length === 0) return;

        let history = JSON.parse(localStorage.getItem('sortHistory')) || [];
        history.unshift({
            timestamp: new Date().toLocaleString(),
            sorted1: sorted1,
            sorted2: sorted2
        });

        if (history.length > 10) history = history.slice(0, 10);
        localStorage.setItem('sortHistory', JSON.stringify(history));
        renderHistory();
    }

    function renderHistory() {
        const container = document.getElementById('historyList');
        const history = JSON.parse(localStorage.getItem('sortHistory')) || [];

        if (history.length === 0) {
            container.innerHTML = '<div class="no-history">暂无历史结果</div>';
            return;
        }

        let html = '';
        history.forEach(item => {
            const firstRow = item.sorted1;
            const secondRow = item.sorted2;
            const maxLen = Math.max(firstRow.length, secondRow.length);
            const paddedFirst = [...firstRow];
            const paddedSecond = [...secondRow];
            while (paddedFirst.length < maxLen) paddedFirst.push("");
            while (paddedSecond.length < maxLen) paddedSecond.push("");

            let tableHtml = '<table><tr>';
            paddedFirst.forEach(n => {
                tableHtml += '<td>' + (n !== "" ? n : "") + '</td>';
            });
            tableHtml += '</tr><tr>';
            paddedSecond.forEach(n => {
                tableHtml += '<td>' + (n !== "" ? n : "") + '</td>';
            });
            tableHtml += '</tr></table>';

            html += '<div class="history-item">' +
                        '<div class="history-time">' + item.timestamp + '</div>' +
                        '<div class="table-wrap">' + tableHtml + '</div>' +
                    '</div>';
        });
        container.innerHTML = html;
    }

    function deleteAllHistory() {
        if (confirm('确定要删除全部历史结果吗？')) {
            localStorage.removeItem('sortHistory');
            renderHistory();
        }
    }

    // ========== 模式切换事件 ==========
    document.getElementById('modeA').addEventListener('click', function () {
        currentMode = 'A';
        updateModeButtons();
        saveMode();
    });

    document.getElementById('modeB').addEventListener('click', function () {
        currentMode = 'B';
        updateModeButtons();
        saveMode();
    });

    // ========== 原有自动保存与恢复 ==========
    document.getElementById("input1").addEventListener("input", function () {
        localStorage.setItem("firstData", this.value);
    });

    document.getElementById("input2").addEventListener("input", function () {
        localStorage.setItem("secondData", this.value);
    });

    window.onload = function () {
        document.getElementById("input1").value = localStorage.getItem("firstData") || "";
        document.getElementById("input2").value = localStorage.getItem("secondData") || "";

        currentMode = localStorage.getItem('sortMode') || 'A';
        updateModeButtons();

        document.getElementById('deleteAllHistory').addEventListener('click', deleteAllHistory);
        renderHistory();

        if (document.getElementById("input1").value.trim() !== '' || document.getElementById("input2").value.trim() !== '') {
            runSort();
        }
    };
</script>

</body>
</html>
