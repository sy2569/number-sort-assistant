<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字排序助手</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            padding: 20px;
            background: #f2f2f7;
        }

        .container {
            max-width: 600px;
            margin: auto;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 6px;
        }

        .mode-switch {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .mode-btn {
            padding: 8px 20px;
            font-size: 15px;
            border: 1px solid #007aff;
            background: white;
            color: #007aff;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            width: auto;
            margin: 0;
        }

        .mode-btn.active {
            background: #007aff;
            color: white;
        }

        label {
            display: block;
            margin-top: 15px;
            font-size: 16px;
        }

        textarea {
            width: 100%;
            height: 45px;
            font-size: 18px;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #aaa;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            font-size: 18px;
            color: white;
            background: #007aff;
            border: none;
            border-radius: 8px;
        }

        .clear-button {
            background: #8e8e93;
        }

        .table-wrap {
            margin-top: 25px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            border-collapse: collapse;
            table-layout: fixed;
        }

        td {
            border: 1px solid black;
            text-align: center;
            font-size: 22px;
            height: 50px;
            min-width: 50px;
        }

        .history-section {
            margin-top: 35px;
            border-top: 1px solid #ccc;
            padding-top: 20px;
        }

        .history-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .history-item {
            background: #fff;
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 15px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.1);
        }

        .history-time {
            font-size: 13px;
            color: #666;
            margin-bottom: 6px;
        }

        .delete-all-history-button {
            background: #ff3b30;
            margin-top: 12px;
        }

        .no-history {
            color: #999;
            font-size: 15px;
            text-align: center;
            padding: 15px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>数字排序助手</h1>

    <!-- 排序模式切换按钮 -->
    <div class="mode-switch">
        <button id="modeA" class="mode-btn active">重复去重排序</button>
        <button id="modeB" class="mode-btn">对齐排序</button>
    </div>

    <label>第一组数据：</label>
    <textarea id="input1" placeholder="例如：5 3 8 3 1"></textarea>

    <label>第二组数据：</label>
    <textarea id="input2" placeholder="例如：9 2 6 2 7"></textarea>

    <button class="clear-button" onclick="clearSecond()">清除第二组数据</button>
    <button onclick="runSort()">排序</button>

    <div class="table-wrap">
        <div id="result"></div>
    </div>

    <!-- 历史记录区域 -->
    <div class="history-section">
        <div class="history-title">📋 最近10条结果</div>
        <div id="historyList"></div>
        <button id="deleteAllHistory" class="delete-all-history-button">🗑️ 删除全部历史记录</button>
    </div>
</div>

<script>
    // 当前排序模式，默认模式A（去重排序）
    let currentMode = 'A';

    // 提取数字
    function getNumbers(text) {
        text = text.replace(/[，。；、,.;|]+/g, " ");
        return text.trim().split(/\s+/).filter(x => x !== "").map(Number).filter(x => !Number.isNaN(x));
    }

    // 模式A：重复数字保留一个排序，其余重复项放在最后
    function sortModeA(arr) {
        let count = {};
        arr.forEach(n => {
            count[n] = (count[n] || 0) + 1;
        });

        let normal = [];
        let duplicate = [];

        arr.forEach(n => {
            if (count[n] > 1) {
                if (!normal.includes(n)) {
                    normal.push(n);
                } else {
                    duplicate.push(n);
                }
            } else {
                normal.push(n);
            }
        });

        normal.sort((a, b) => a - b);
        return normal.concat(duplicate);
    }

    // 模式B：第一组升序排列；第二组按第一组顺序排列，不在第一组中的数字升序排在最后
    function sortModeB(firstArr, secondArr) {
        // 第一组：升序
        const sortedFirst = [...firstArr].sort((a, b) => a - b);

        // 建立第一组去重顺序映射（用于第二组对齐）
        const firstOrder = new Map();
        let order = 0;
        sortedFirst.forEach(n => {
            if (!firstOrder.has(n)) {
                firstOrder.set(n, order);
                order++;
            }
        });

        // 分离第二组数字
        const inFirst = [];
        const notInFirst = [];
        secondArr.forEach(n => {
            if (firstOrder.has(n)) {
                inFirst.push(n);
            } else {
                notInFirst.push(n);
            }
        });

        // 在第一组中的数字：按第一组顺序排列（稳定排序保持原相对顺序）
        const sortedInFirst = [...inFirst].sort((a, b) => {
            return firstOrder.get(a) - firstOrder.get(b);
        });

        // 不在第一组中的数字：升序排列
        const sortedNotInFirst = [...notInFirst].sort((a, b) => a - b);

        const sortedSecond = sortedInFirst.concat(sortedNotInFirst);

        return { first: sortedFirst, second: sortedSecond };
    }

    // 运行排序
    function runSort() {
        const firstRaw = getNumbers(document.getElementById("input1").value);
        const secondRaw = getNumbers(document.getElementById("input2").value);

        if (firstRaw.length === 0 && secondRaw.length === 0) {
            document.getElementById("result").innerHTML = "";
            return;
        }

        let first, second;

        if (currentMode === 'A') {
            first = sortModeA(firstRaw);
            second = sortModeA(secondRaw);
        } else { // 模式B
            const result = sortModeB(firstRaw, secondRaw);
            first = result.first;
            second = result.second;
        }

        // 补齐第二行长度
        const paddedSecond = [...second];
        while (paddedSecond.length < first.length) {
            paddedSecond.push("");
        }

        let html = "<table><tr>";
        first.forEach(n => {
            html += "<td>" + n + "</td>";
        });
        html += "</tr><tr>";
        paddedSecond.forEach(n => {
            html += "<td>" + (n !== "" ? n : "") + "</td>";
        });
        html += "</tr></table>";

        document.getElementById("result").innerHTML = html;

        // 保存排序结果到历史
        saveHistoryResult(first, second.filter(n => n !== ""));
    }

    function clearSecond() {
        document.getElementById("input2").value = "";
    }

    // ========== 历史记录（只保存结果数组）==========
    function saveHistoryResult(sorted1, sorted2) {
        if (sorted1.length === 0 && sorted2.length === 0) return;

        let history = JSON.parse(localStorage.getItem('sortHistory')) || [];
        history.unshift({
            timestamp: new Date().toLocaleString(),
            sorted1: sorted1,
            sorted2: sorted2
        });

        if (history.length > 10) history = history.slice(0, 10);
        localStorage.setItem('sortHistory', JSON.stringify(history));
        renderHistory();
    }

    function renderHistory() {
        const container = document.getElementById('historyList');
        const history = JSON.parse(localStorage.getItem('sortHistory')) || [];

        if (history.length === 0) {
            container.innerHTML = '<div class="no-history">暂无历史结果</div>';
            return;
        }

        let html = '';
        history.forEach(item => {
            const firstRow = item.sorted1;
            const secondRow = [...item.sorted2];
            while (secondRow.length < firstRow.length) {
                secondRow.push("");
            }

            let tableHtml = '<table><tr>';
            firstRow.forEach(n => {
                tableHtml += '<td>' + n + '</td>';
            });
            tableHtml += '</tr><tr>';
            secondRow.forEach(n => {
                tableHtml += '<td>' + (n !== "" ? n : '') + '</td>';
            });
            tableHtml += '</tr></table>';

            html += '<div class="history-item">' +
                        '<div class="history-time">' + item.timestamp + '</div>' +
                        '<div class="table-wrap">' + tableHtml + '</div>' +
                    '</div>';
        });
        container.innerHTML = html;
    }

    function deleteAllHistory() {
        if (confirm('确定要删除全部历史结果吗？')) {
            localStorage.removeItem('sortHistory');
            renderHistory();
        }
    }

    // ========== 模式切换 ==========
    document.getElementById('modeA').addEventListener('click', function () {
        currentMode = 'A';
        document.getElementById('modeA').classList.add('active');
        document.getElementById('modeB').classList.remove('active');
    });

    document.getElementById('modeB').addEventListener('click', function () {
        currentMode = 'B';
        document.getElementById('modeB').classList.add('active');
        document.getElementById('modeA').classList.remove('active');
    });

    // ========== 原有自动保存与恢复 ==========
    document.getElementById("input1").addEventListener("input", function () {
        localStorage.setItem("firstData", this.value);
    });

    document.getElementById("input2").addEventListener("input", function () {
        localStorage.setItem("secondData", this.value);
    });

    window.onload = function () {
        document.getElementById("input1").value = localStorage.getItem("firstData") || "";
        document.getElementById("input2").value = localStorage.getItem("secondData") || "";

        document.getElementById('deleteAllHistory').addEventListener('click', deleteAllHistory);
        renderHistory();

        if (document.getElementById("input1").value.trim() !== '' || document.getElementById("input2").value.trim() !== '') {
            runSort();
        }
    };
</script>

</body>
</html>
